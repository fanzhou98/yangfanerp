# Loaded inside http{}. Categorize paths: never log arbitrary URLs or query data.
map $uri $erp_security_route {
    default other;
    /api/auth/login login;
    /api/health health;
    ~^/api/ api;
}
log_format erp_security escape=json
    '{"at":"$time_iso8601","ip":"$remote_addr","route":"$erp_security_route",'
    '"status":$status,"duration":$request_time}';
